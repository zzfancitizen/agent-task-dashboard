name: Task board controller

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches-ignore: [gh-pages, taskboard-state]
    paths:
      - 'taskboard/**'
      - 'site/**'
      - 'scripts/**'
      - 'bin/**'
      - 'launchers/**'
      - 'integrations/**'
      - 'resources/**'
      - 'docs/examples/**'
      - 'README*.md'
      - '.github/workflows/taskboard.yml'

# A later pending run may replace an earlier one. Requests remain in Issues:
# every surviving run drains the retained mailbox, so requests are not lost.
concurrency:
  group: taskboard-controller
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  reconcile:
    if: >-
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'issue_comment' || contains(github.event.comment.body, '<!-- taskboard:command:v1 -->'))
    runs-on: ${{ vars.TASKBOARD_RUNNER || (github.server_url == 'https://github.com' && 'ubuntu-latest' || 'self-hosted') }}
    timeout-minutes: 15
    steps:
      - name: Read trusted controller code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check runner tools
        run: |
          python3 --version
          gh --version
      - name: Process requests and publish the static branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/actions_controller.py
      - name: Request a Pages build
        if: vars.TASKBOARD_PAGES_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/request_pages_build.py
